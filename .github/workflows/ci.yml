name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published by toolchain.yml. Falling back to a local build keeps this workflow working
      # before that has ever run, at the cost of compiling a cross GCC on a two-core runner.
      - name: Fetch toolchain image
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/doom-os-toolchain:latest"

          if docker pull "$image"; then
            docker tag "$image" doom-os-toolchain:ci
          else
            echo "::warning::$image not published yet - building the toolchain locally"
            docker build -t doom-os-toolchain:ci .
          fi

      - name: Configure
        run: |
          docker run --rm \
            -v "$PWD":/workspace/DoomOS -w /workspace/DoomOS \
            --user "$(id -u):$(id -g)" \
            doom-os-toolchain:ci \
            cmake --preset default

      # .clang-format needs clang-format 20; older releases reject the file outright rather
      # than degrading, so this also catches the image drifting off the pinned version.
      - name: Check formatting
        run: |
          docker run --rm \
            -v "$PWD":/workspace/DoomOS -w /workspace/DoomOS \
            --user "$(id -u):$(id -g)" \
            doom-os-toolchain:ci \
            cmake --build build --target format-check

      - name: Build kernel and ISO
        run: |
          docker run --rm \
            -v "$PWD":/workspace/DoomOS -w /workspace/DoomOS \
            --user "$(id -u):$(id -g)" \
            doom-os-toolchain:ci \
            cmake --build build
