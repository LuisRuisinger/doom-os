name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build kernel and ISO
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/doom-os-toolchain:latest"
          docker pull "$image"
          docker run --rm \
            -v "$PWD":/workspace/DoomOS -w /workspace/DoomOS \
            --user "$(id -u):$(id -g)" \
            "$image" \
            sh -c 'cmake --preset default && cmake --build build'
