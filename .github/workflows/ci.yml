name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    needs: toolchain
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    # Root, because the runner owns the checkout directory; HOME is /github/home.
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    env:
      # Guards local commits; CI checks out master itself.
      SKIP: no-commit-to-branch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ needs.toolchain.outputs.image }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # clang-tidy reads build/compile_commands.json.
      - run: cmake --preset default

      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  toolchain:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: |
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/doom-os-toolchain:${{ hashFiles('Dockerfile') }}" >> "$GITHUB_OUTPUT"

      - id: published
        run: |
          if docker manifest inspect "${{ steps.image.outputs.ref }}" >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.yes == 'false'
        uses: docker/setup-buildx-action@v3

      - if: steps.published.outputs.yes == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    needs: toolchain
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker pull "${{ needs.toolchain.outputs.image }}"
          docker run --rm \
            -v "$PWD":/workspace/DoomOS -w /workspace/DoomOS \
            --user "$(id -u):$(id -g)" \
            "${{ needs.toolchain.outputs.image }}" \
            sh -c 'cmake --preset default && cmake --build build'
